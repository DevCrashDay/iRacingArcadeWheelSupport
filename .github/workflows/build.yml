name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WheelBridge.sln

      - name: Build
        run: dotnet build WheelBridge.sln -c Release --no-restore

      - name: Test
        run: dotnet test WheelBridge.sln -c Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/WheelBridge/WheelBridge.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: WheelBridge
          path: publish/
